<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02050a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: transparent;
            cursor: crosshair;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(12, 18, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .toggle-btn.active {
            background: rgba(140, 180, 255, 0.4);
            border-color: rgba(140, 180, 255, 0.8);
            box-shadow: 0 0 10px rgba(140, 180, 255, 0.3);
        }

        .instructions {
            font-size: 12px;
            color: #99aabf;
            max-width: 250px;
            line-height: 1.4;
        }
    </style>
    <title>Dynamic Black Holes & Growing Planets</title>
</head>
<body>
    <div id="ui-panel">
        <button id="btn-planet" class="toggle-btn active">Mode: Place Planet</button>
        <button id="btn-bh" class="toggle-btn">Mode: Place Black Hole</button>
        <div class="instructions" id="inst-text">
            Hold mouse down to GROW a stationary planet. Drag before releasing to sling it!
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Physics Constants
        const G_BH = 1;           
        const G_PLANET = 0.1;  
        const G_BH_BH = 0.01;    
        
        // Visual Constants for Lensing
        const LENS_RADIUS_MULTIPLIER = 3; 
        const MAX_STRETCH = 100;
        
        let blackHoles = [];
        let stars = [];
        let balls = [];
        
        const planetColors = ['#F0C1E1', '#A9DEF9', '#D0F4DE', '#FCF6BD', '#E4C1F9', '#FFD1BA'];

        let activeGrowing = null; 
        let dragging = false;
        let startX = 0, startY = 0, endX = 0, endY = 0;
        let placementMode = 'PLANET'; 

        // UI Listeners
        document.getElementById('btn-planet').addEventListener('click', (e) => {
            e.stopPropagation();
            placementMode = 'PLANET';
            document.getElementById('btn-planet').classList.add('active');
            document.getElementById('btn-bh').classList.remove('active');
            document.getElementById('inst-text').innerText = "Hold mouse down to GROW a stationary planet. Drag before releasing to sling it!";
        });
        document.getElementById('btn-bh').addEventListener('click', (e) => {
            e.stopPropagation();
            placementMode = 'BLACKHOLE';
            document.getElementById('btn-bh').classList.add('active');
            document.getElementById('btn-planet').classList.remove('active');
            document.getElementById('inst-text').innerText = "Hold mouse down to GROW a stationary Black Hole. Drag to sling it!";
        });

        function init() {
            resizeCanvas();
            blackHoles.push({
                x: canvas.width / window.devicePixelRatio / 2,
                y: canvas.height / window.devicePixelRatio / 2,
                radius: 25,
                vx: 0,
                vy: 0,
                dead: false
            });
            seedStars();
            updatePhysics();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        }
        window.addEventListener('resize', resizeCanvas);

        function seedStars() {
            stars = Array.from({ length: 16000 }, () => ({
                x: (Math.random() - 0.5) * 5000 + window.innerWidth/2, 
                y: (Math.random() - 0.5) * 5000 + window.innerHeight/2, 
                r: Math.random() * 1.5 + 0.3,
                color: Math.random() > 0.8 ? '#ffcc99' : (Math.random() > 0.6 ? '#99ccff' : '#ffffff'),
                a: Math.random() * 0.8 + 0.2,
                twinkle: Math.random() * Math.PI * 2
            }));
        }

        // Added excludeBH parameter for mutual lensing
        function lensPoint(x, y, excludeBH = null) {
            let finalX = x;
            let finalY = y;
            let dominantStretch = 1;
            let dominantSquish = 1;
            let dominantAngle = 0;
            let maxInfluence = -1;

            for (const bh of blackHoles) {
                if (bh === excludeBH) continue; // Skip self

                const RE = bh.radius * LENS_RADIUS_MULTIPLIER; 
                const dx = x - bh.x;
                const dy = y - bh.y;
                const r = Math.sqrt(dx * dx + dy * dy);
                
                if (r < 0.1) continue;

                const rApp = Math.sqrt(r * r + RE * RE);
                const displacement = rApp - r;
                
                finalX += (dx / r) * displacement;
                finalY += (dy / r) * displacement;

                const influence = RE / r;
                if (influence > maxInfluence) {
                    maxInfluence = influence;
                    dominantStretch = Math.min(rApp / r, MAX_STRETCH); 
                    dominantSquish = r / rApp;
                    dominantAngle = Math.atan2(dy, dx);
                }
            }

            return { x: finalX, y: finalY, stretch: dominantStretch, squish: dominantSquish, angle: dominantAngle };
        }

        function drawBackground() {
            ctx.clearRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
            const time = performance.now();

            for (const star of stars) {
                const lensed = lensPoint(star.x, star.y);
                const pulse = 0.6 + 0.4 * Math.sin(time * 0.0016 + star.twinkle);
                
                ctx.save();
                ctx.translate(lensed.x, lensed.y);
                ctx.rotate(lensed.angle);
                ctx.beginPath();
                ctx.ellipse(0, 0, star.r * lensed.squish, star.r * lensed.stretch, 0, 0, Math.PI * 2);
                ctx.globalAlpha = star.a * pulse;
                ctx.fillStyle = star.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Updated to apply lensing to black holes themselves
        function drawBlackHoles() {
            for (const bh of blackHoles) {
                const RE = bh.radius * LENS_RADIUS_MULTIPLIER;
                
                const lensed = lensPoint(bh.x, bh.y, bh);

                ctx.save();
                ctx.translate(lensed.x, lensed.y);
                ctx.rotate(lensed.angle);

                // Draw Shadow as ellipse
                ctx.beginPath();
                ctx.ellipse(0, 0, (RE - 0.5) * lensed.squish, (RE - 0.5) * lensed.stretch, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();

                // Photon Ring as ellipse
                ctx.beginPath();
                ctx.ellipse(0, 0, RE * lensed.squish, RE * lensed.stretch, 0, 0, Math.PI * 2);
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.stroke();

                ctx.restore();
            }
        }

        function drawOverlayUI() {
            if (activeGrowing) {
                ctx.beginPath();
                ctx.arc(activeGrowing.x, activeGrowing.y, activeGrowing.radius, 0, Math.PI * 2);
                if (activeGrowing.type === 'PLANET') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.fill();
                    ctx.stroke();
                }
            }

            if (dragging && activeGrowing && (startX !== endX || startY !== endY)) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1.2;
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawScene() {
            drawBackground();
            drawBlackHoles();

            ctx.save();
            balls.forEach((ball) => {
                if (ball.trail.length > 1) {
                    ctx.beginPath();
                    const startLensed = lensPoint(ball.trail[0].x, ball.trail[0].y);
                    ctx.moveTo(startLensed.x, startLensed.y);
                    for (let i = 1; i < ball.trail.length; i++) {
                        const lensed = lensPoint(ball.trail[i].x, ball.trail[i].y);
                        ctx.lineTo(lensed.x, lensed.y);
                    }
                    ctx.strokeStyle = ball.color;
                    ctx.globalAlpha = 0.4;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }
            });
            ctx.restore();

            for (const ball of balls) {
                const lensed = lensPoint(ball.x, ball.y);
                ctx.save();
                ctx.translate(lensed.x, lensed.y);
                ctx.rotate(lensed.angle);
                ctx.beginPath();
                ctx.ellipse(0, 0, ball.radius * lensed.squish, ball.radius * lensed.stretch, 0, 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();
                ctx.restore();
            }

            drawOverlayUI();
        }

        function updatePhysics() {
            
            if (activeGrowing) {
                const dragDist = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
                
                if (dragDist < 5) {
                    activeGrowing.radius += (activeGrowing.type === 'PLANET' ? 0.1 : 0.3);
                }
            }

            // --- BLACK HOLE INTERACTION (Gravity & Merging) ---
            for (let i = 0; i < blackHoles.length; i++) {
                if (blackHoles[i].dead) continue;
                for (let j = i + 1; j < blackHoles.length; j++) {
                    if (blackHoles[j].dead) continue;

                    const bh1 = blackHoles[i];
                    const bh2 = blackHoles[j];
                    const dx = bh2.x - bh1.x;
                    const dy = bh2.y - bh1.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq);

                    // Radius Collision check
                    if (dist < bh1.radius + bh2.radius) {
                        const a1 = bh1.radius * bh1.radius;
                        const a2 = bh2.radius * bh2.radius;
                        const totalA = a1 + a2;
                        
                        const vx = (bh1.vx * a1 + bh2.vx * a2) / totalA;
                        const vy = (bh1.vy * a1 + bh2.vy * a2) / totalA;
                        const newRadius = bh1.radius + bh2.radius;

                        if (a1 > a2) {
                            bh1.vx = vx; bh1.vy = vy; bh1.radius = newRadius;
                            bh2.dead = true;
                        } else {
                            bh2.vx = vx; bh2.vy = vy; bh2.radius = newRadius;
                            bh1.dead = true;
                        }
                    } else {
                        const force = G_BH_BH / distSq;
                        bh1.vx += force * dx * (bh2.radius * bh2.radius);
                        bh1.vy += force * dy * (bh2.radius * bh2.radius);
                        bh2.vx -= force * dx * (bh1.radius * bh1.radius);
                        bh2.vy -= force * dy * (bh1.radius * bh1.radius);
                    }
                }

                // Orbital Decay: apply a small friction multiplier
                blackHoles[i].vx *= 0.998;
                blackHoles[i].vy *= 0.998;

                // Apply velocity to black hole
                blackHoles[i].x += blackHoles[i].vx;
                blackHoles[i].y += blackHoles[i].vy;
            }
            
            blackHoles = blackHoles.filter(bh => !bh.dead);

            // --- PLANET INTERACTIONS (Gravity & Merging) ---
            for (let i = 0; i < balls.length; i++) {
                if (balls[i].dead) continue;
                for (let j = i + 1; j < balls.length; j++) {
                    if (balls[j].dead) continue;

                    const b1 = balls[i];
                    const b2 = balls[j];
                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq);

                    if (dist < b1.radius + b2.radius) {
                        const m1 = b1.radius * b1.radius; 
                        const m2 = b2.radius * b2.radius;
                        const totalM = m1 + m2;
                        
                        const vx = (b1.vx * m1 + b2.vx * m2) / totalM;
                        const vy = (b1.vy * m1 + b2.vy * m2) / totalM;
                        const newRadius = Math.sqrt(totalM);

                        if (m1 > m2) {
                            b1.vx = vx; b1.vy = vy; b1.radius = newRadius;
                            b2.dead = true;
                        } else {
                            b2.vx = vx; b2.vy = vy; b2.radius = newRadius;
                            b1.dead = true;
                        }
                    } else {
                        const force = G_PLANET / distSq / distSq;
                        b1.vx += force * dx * (b2.radius * b2.radius);
                        b1.vy += force * dy * (b2.radius * b2.radius);
                        b2.vx -= force * dx * (b1.radius * b1.radius);
                        b2.vy -= force * dy * (b1.radius * b1.radius);
                    }
                }
            }

            // --- PLANETS FALLING INTO BLACK HOLES ---
            balls = balls.filter((ball) => {
                if (ball.dead) return false;

                ball.x += ball.vx;
                ball.y += ball.vy;

                let swallowed = false;
                for (const bh of blackHoles) {
                    const dx = bh.x - ball.x;
                    const dy = bh.y - ball.y;
                    const distSq = dx * dx + dy * dy;
                    
                    if (Math.sqrt(distSq) < bh.radius) {
                        
                        const areaBH = Math.PI * bh.radius * bh.radius;
                        const areaPlanet = Math.PI * ball.radius * ball.radius;
                        
                        const newArea = areaBH + (areaPlanet * 0.01); 
                        bh.radius = Math.sqrt(newArea / Math.PI); 

                        swallowed = true;
                        break;
                    }
                    const dist = Math.sqrt(distSq); 

                    const massBH = bh.radius * bh.radius * 10; 
                    const Acceleration = (G_BH * massBH) / distSq;

                    ball.vx += Acceleration * (dx / dist);
                    ball.vy += Acceleration * (dy / dist);
                }

                if (swallowed) return false;

                ball.trail.push({ x: ball.x, y: ball.y });
                
                const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                const dynamicTailLength = Math.floor((speed * 10));
                
                while (ball.trail.length > dynamicTailLength) {
                    ball.trail.shift();
                }

                return true;
            });

            drawScene();
            requestAnimationFrame(updatePhysics);
        }

        // --- CONTROLS ---
        canvas.addEventListener('mousedown', (e) => {
            if (e.target !== canvas) return;
            dragging = true;
            startX = e.clientX; startY = e.clientY;
            endX = e.clientX; endY = e.clientY;
            
            activeGrowing = {
                type: placementMode,
                x: startX,
                y: startY,
                radius: placementMode === 'PLANET' ? 4 : 15 
            };
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!dragging) return;
            endX = e.clientX;
            endY = e.clientY;
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!dragging) return;
            const vx = -(endX - startX) / 25;
            const vy = -(endY - startY) / 25;
            
            if (placementMode === 'PLANET') {
                const color = planetColors[Math.floor(Math.random() * planetColors.length)];
                balls.push({ 
                    x: startX, y: startY, 
                    radius: activeGrowing.radius, 
                    vx, vy, 
                    color: color, 
                    trail: [], 
                    dead: false 
                });
            } else if (placementMode === 'BLACKHOLE') {
                blackHoles.push({ 
                    x: startX, y: startY, 
                    radius: activeGrowing.radius, 
                    vx: vx / 2, 
                    vy: vy / 2,
                    dead: false 
                });
            }
            
            dragging = false;
            activeGrowing = null;
        });

        // Touch Support
        canvas.addEventListener('touchstart', (e) => {
            if (e.target !== canvas) return;
            e.preventDefault();
            dragging = true; 
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            endX = startX; endY = startY;

            activeGrowing = {
                type: placementMode,
                x: startX,
                y: startY,
                radius: placementMode === 'PLANET' ? 4 : 15
            };
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!dragging) return;
            e.preventDefault();
            endX = e.touches[0].clientX; endY = e.touches[0].clientY;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (!dragging) return;
            const vx = -(endX - startX) / 10;
            const vy = -(endY - startY) / 10;
            
            if (placementMode === 'PLANET') {
                const color = planetColors[Math.floor(Math.random() * planetColors.length)];
                balls.push({ x: startX, y: startY, radius: activeGrowing.radius, vx, vy, color, trail: [], dead: false });
            } else if (placementMode === 'BLACKHOLE') {
                blackHoles.push({ x: startX, y: startY, radius: activeGrowing.radius, vx: vx / 2, vy: vy / 2, dead: false });
            }
            
            dragging = false;
            activeGrowing = null;
        });

        init();
    </script>
</body>
</html>
