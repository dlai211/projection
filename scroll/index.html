<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrolling Text Generator</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: black;
            overflow: hidden;
            font-family: sans-serif;
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out;
        }

        /* Define background images for styles */
        body.bg-classic-black { background-image: none; background-color: #091413; }
        body.bg-classic-white1 { background-image: none; background-color: #fcf7f3; }
        body.bg-classic-white2 { background-image: none; background-color: #fdfdf1; }
        body.bg-tiktok { background-image: none; background-color: #091413; }
        body.bg-black-physics { background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('Black.jpg'); }
        body.bg-light-color { background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('LightColor.jpg'); }
        body.bg-green-star-wars { background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('DarkGreen.png'); }
        body.bg-purple { background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('Purple.jpg'); }
        body.bg-green-hill { background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('Green.jpg'); }
        body.bg-dark-blue-forest { background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('DarkBlue.jpg'); }
        body.bg-white { background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('White.png'); }
        body.bg-turquoise-tree { background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('Turquoise.webp'); }

        /* --- Retractable Control Panel UI --- */
        #controls-wrapper {
            position: absolute;
            top: 20px;
            left: 0;
            z-index: 10;
            display: flex;
            align-items: flex-start;
            /* Hide the panel but leave the 40px handle visible */
            transform: translateX(calc(-100% + 40px)); 
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Triggers on PC hover OR mobile click (via JS adding the 'open' class) */
        #controls-wrapper:hover, 
        #controls-wrapper.open {
            transform: translateX(0);
        }

        #controls {
            background: rgba(15, 15, 15, 0.85); /* Sleek dark mode */
            backdrop-filter: blur(8px); /* Frosted glass effect */
            -webkit-backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 0 0 12px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: none;
            box-shadow: 4px 4px 20px rgba(0,0,0,0.7);
            color: #eee;
        }

        #controls-handle {
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(8px);
            width: 40px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: none;
            color: white;
            font-size: 20px;
        }

        #controls label {
            display: flex;
            flex-direction: column;
            font-size: 13px;
            font-weight: bold;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        #controls input[type="text"], #controls select {
            padding: 8px;
            font-size: 14px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 4px;
            outline: none;
        }

        #controls input[type="text"]:focus, #controls select:focus {
            border-color: #888;
        }

        /* --- Seamless Scroller Setup --- */
        .scroll-wrapper {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            overflow: hidden;
        }

        .scroll-container {
            display: flex;
            width: max-content;
            animation: scroll-left var(--speed, 15s) linear infinite;
        }

        .scrolling-text {
            display: flex;
            font-size: 45vh; 
            padding-right: 150px; 
            white-space: nowrap;
        }

        @keyframes scroll-left {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* --- Font Options --- */
        .font-san-serif { font-family: sans-serif; }
        .font-times-new-roman { font-family: 'Times New Roman', Times, serif; }
        .font-cursive { font-family: 'Comic Sans MS', cursive, sans-serif; }
        .font-monospace { font-family: monospace; }
        .font-optima {font-family: 'Optima', Optima, Candara, 'Segoe UI', Segoe, Optima, Arial, sans-serif;}        
        .font-courier { font-family: 'Courier New', Courier, monospace; }
        .font-garamond { font-family: 'Garamond', 'Baskerville', serif; }
        .font-monaco { font-family: 'Monaco', 'Consolas', monospace; }


        /* --- Text Styles --- */
        .style-classic { color: #cecece; text-shadow: none; font-weight: normal; }
        .style-classic-white1 { color: #333333; text-shadow: none; font-weight: normal; }
        .style-classic-white2 { color: #0160a2; text-shadow: none; font-weight: normal; }
        .style-tiktok { color: white; text-shadow: 0.04em 0.04em 0 #FE2C55, -0.04em -0.04em 0 #25F4EE; font-weight: normal; }
        .style-black-physics { color: #dae6e6; text-shadow: none; font-weight: normal; }
        .style-light-color { color: #2c4f6f; text-shadow: none; font-weight: normal; }
        .style-green-star-wars { color: #f9f3dd; text-shadow: none; font-weight: normal; }
        .style-purple { color: #fcf1d1; text-shadow: none; font-weight: normal; }
        .style-green-hill { color: #3a773b; text-shadow: none; font-weight: normal; }
        .style-dark-blue-forest { color: #99a0b0; text-shadow: none; font-weight: normal; }
        .style-white { color: #2c4f6f; text-shadow: none; font-weight: normal; }
        .style-turquoise-tree { color: #1a3046; text-shadow: none; font-weight: normal; }

    </style>
</head>
<body class="bg-classic">

    <div id="controls-wrapper">
        <div id="controls">
            <label>
                Edit Text:
                <input type="text" id="textInput" value="Hunter's Mom -" />
            </label>
            <label>
                Scroll Speed:
                <input type="range" id="speedInput" min="1" max="30" value="15" dir="rtl" />
            </label>
            <label>
                Choose Font: 
                <select id="fontInput">
                    <option value="font-san-serif">San-serif</option>
                    <option value="font-times-new-roman">Times New Roman</option>
                    <option value="font-optima">Optima</option>
                    <option value="font-courier">Courier</option>
                    <option value="font-garamond">Garamond</option>
                    <option value="font-monaco">Monaco</option>
                    <option value="font-cursive">Cursive</option>
                    <option value="font-monospace">Monospace</option>
                </select>
            </label>
            <label>
                Choose Style:
                <select id="styleInput">
                    <option value="style-classic-black">Classic Black Bg</option>
                    <option value="style-classic-white1">Classic White Bg Black Txt</option>
                    <option value="style-classic-white2">Classic White Bg Blue Txt</option>
                    <option value="style-tiktok">TikTok</option>
                    <option value="style-black-physics">Black Physics</option>
                    <option value="style-light-color">Colorful Person</option>
                    <option value="style-green-star-wars">Green Star Wars</option>
                    <option value="style-purple">Purple</option>
                    <option value="style-green-hill">Green Hill</option>
                    <option value="style-dark-blue-forest">Dark Blue Forest</option>
                    <option value="style-white">White</option>
                    <option value="style-turquoise-tree">Turquoise Tree</option>
                </select>
            </label>
        </div>
        <div id="controls-handle">⚙️</div>
    </div>

    <div class="scroll-wrapper">
        <div class="scroll-container" id="scrollContainer">
            <div class="scrolling-text style-classic font-san-serif" id="text1">Hunter's Mom - </div>
            <div class="scrolling-text style-classic font-san-serif" id="text2">Hunter's Mom - </div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const speedInput = document.getElementById('speedInput');
        const fontInput = document.getElementById('fontInput');
        const styleInput = document.getElementById('styleInput');
        const scrollContainer = document.getElementById('scrollContainer');
        const text1 = document.getElementById('text1');
        const text2 = document.getElementById('text2');
        const controlsWrapper = document.getElementById('controls-wrapper');
        const controls = document.getElementById('controls');

        controlsWrapper.addEventListener('click', () => {
            controlsWrapper.classList.toggle('open');
        });
        
        controls.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        textInput.addEventListener('input', (e) => {
            const newText = e.target.value + " "; 
            text1.innerText = newText;
            text2.innerText = newText;
        });

        speedInput.addEventListener('input', (e) => {
            const seconds = e.target.value;
            scrollContainer.style.setProperty('--speed', `${seconds}s`);
        });

        styleInput.addEventListener('change', (e) => {
            const newStyle = e.target.value;

            text1.classList.remove("style-classic-black", "style-classic-white1", "style-classic-white2", "style-tiktok", "style-black-physics", "style-light-color", "style-green-star-wars", "style-purple", "style-green-hill", "style-dark-blue-forest", "style-white", "style-turquoise-tree");
            text2.classList.remove("style-classic-black", "style-classic-white1", "style-classic-white2", "style-tiktok", "style-black-physics", "style-light-color", "style-green-star-wars", "style-purple", "style-green-hill", "style-dark-blue-forest", "style-white", "style-turquoise-tree");
            
            text1.classList.add(newStyle);
            text2.classList.add(newStyle);

            // Change the body background class to match (removes "style-" and adds "bg-")
            document.body.className = newStyle.replace('style-', 'bg-');
        });

        fontInput.addEventListener('change', (e) => {
            const newFont = e.target.value;
            const allFonts = ['font-san-serif', 'font-times-new-roman', 'font-optima', 'font-courier', 'font-garamond', 'font-monaco', 'font-cursive', 'font-monospace'];
            
            text1.classList.remove(...allFonts);
            text2.classList.remove(...allFonts);
            
            text1.classList.add(newFont);
            text2.classList.add(newFont);
        });
    </script>
</body>
</html>
