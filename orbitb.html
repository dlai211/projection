<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02050a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: transparent;
            cursor: crosshair;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(12, 18, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .toggle-btn.active {
            background: rgba(140, 180, 255, 0.4);
            border-color: rgba(140, 180, 255, 0.8);
            box-shadow: 0 0 10px rgba(140, 180, 255, 0.3);
        }

        .instructions {
            font-size: 12px;
            color: #99aabf;
            max-width: 200px;
            line-height: 1.4;
        }
    </style>
    <title>Multi-Black Hole & N-Body Orbit</title>
</head>
<body>
    <div id="ui-panel">
        <button id="btn-planet" class="toggle-btn active">Mode: Place Planet</button>
        <button id="btn-bh" class="toggle-btn">Mode: Place Black Hole</button>
        <div class="instructions" id="inst-text">
            Drag and release to sling a planet. Planets exert gravity on each other and will merge upon collision.
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Physics Constants
        const G_BH = 10;           // Restored the strong screen-space gravity 
        const G_PLANET = 0.01;     // Planet-to-planet gravity modifier
        
        let blackHoles = [];
        let stars = [];
        let balls = [];
        
        // Soft, non-jarring color palette for planets
        const planetColors = ['#F0C1E1', '#A9DEF9', '#D0F4DE', '#FCF6BD', '#E4C1F9', '#FFD1BA'];

        let drawOverlay = false;
        let dragging = false;
        let startX = 0, startY = 0, endX = 0, endY = 0;
        let placementMode = 'PLANET'; // 'PLANET' or 'BLACKHOLE'

        // UI Listeners
        document.getElementById('btn-planet').addEventListener('click', (e) => {
            e.stopPropagation();
            placementMode = 'PLANET';
            document.getElementById('btn-planet').classList.add('active');
            document.getElementById('btn-bh').classList.remove('active');
            document.getElementById('inst-text').innerText = "Drag and release to sling a planet. Planets merge on collision.";
        });
        document.getElementById('btn-bh').addEventListener('click', (e) => {
            e.stopPropagation();
            placementMode = 'BLACKHOLE';
            document.getElementById('btn-bh').classList.add('active');
            document.getElementById('btn-planet').classList.remove('active');
            document.getElementById('inst-text').innerText = "Click anywhere to spawn a new stationary Black Hole.";
        });

        function init() {
            resizeCanvas();
            // Start with one central black hole
            blackHoles.push({
                x: canvas.width / window.devicePixelRatio / 2,
                y: canvas.height / window.devicePixelRatio / 2,
                radius: 45
            });
            seedStars();
            updatePhysics();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        }
        window.addEventListener('resize', resizeCanvas);

        function seedStars() {
            stars = Array.from({ length: 8000 }, () => ({
                x: (Math.random() - 0.5) * 5000 + window.innerWidth/2, 
                y: (Math.random() - 0.5) * 5000 + window.innerHeight/2, 
                r: Math.random() * 1.5 + 0.3,
                color: Math.random() > 0.8 ? '#ffcc99' : (Math.random() > 0.6 ? '#99ccff' : '#ffffff'),
                a: Math.random() * 0.8 + 0.2,
                twinkle: Math.random() * Math.PI * 2
            }));
        }

        // --- MULTI-LENSING OPTICS ---
        function lensPoint(x, y) {
            let finalX = x;
            let finalY = y;
            let dominantStretch = 1;
            let dominantSquish = 1;
            let dominantAngle = 0;
            let maxInfluence = -1;

            for (const bh of blackHoles) {
                const RE = bh.radius * 3;
                const dx = x - bh.x;
                const dy = y - bh.y;
                const r = Math.sqrt(dx * dx + dy * dy);
                
                if (r < 0.1) continue;

                const rApp = Math.sqrt(r * r + RE * RE);
                const displacement = rApp - r;
                
                finalX += (dx / r) * displacement;
                finalY += (dy / r) * displacement;

                const influence = RE / r;
                if (influence > maxInfluence) {
                    maxInfluence = influence;
                    dominantStretch = Math.min(rApp / r, 80);
                    dominantSquish = r / rApp;
                    dominantAngle = Math.atan2(dy, dx);
                }
            }

            return { 
                x: finalX, y: finalY, 
                stretch: dominantStretch, 
                squish: dominantSquish, 
                angle: dominantAngle 
            };
        }

        function drawBackground() {
            ctx.clearRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
            const time = performance.now();

            for (const star of stars) {
                const lensed = lensPoint(star.x, star.y);
                const pulse = 0.6 + 0.4 * Math.sin(time * 0.0016 + star.twinkle);
                
                ctx.save();
                ctx.translate(lensed.x, lensed.y);
                ctx.rotate(lensed.angle);
                ctx.beginPath();
                ctx.ellipse(0, 0, star.r * lensed.squish, star.r * lensed.stretch, 0, 0, Math.PI * 2);
                ctx.globalAlpha = star.a * pulse;
                ctx.fillStyle = star.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function drawBlackHoles() {
            for (const bh of blackHoles) {
                const RE = bh.radius * 1.5;
                
                // Draw Shadow
                ctx.beginPath();
                ctx.arc(bh.x, bh.y, RE - 0.5, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();

                // Photon Ring
                ctx.beginPath();
                ctx.arc(bh.x, bh.y, RE, 0, Math.PI * 2);
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.stroke();
            }
        }

        function drawOverlayUI() {
            if (!drawOverlay || placementMode !== 'PLANET') return;

            // Solid Aim Line
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // Calculate Prediction Path (Accounting for all BHs)
            let vx = -(endX - startX) / 10;
            let vy = -(endY - startY) / 10;
            const points = [{ x: startX, y: startY }];
            let collided = false;

            for (let i = 0; i < 250 && !collided; i++) {
                const prev = points[points.length - 1];
                let nextX = prev.x + vx;
                let nextY = prev.y + vy;

                for (const bh of blackHoles) {
                    const dx = bh.x - nextX;
                    const dy = bh.y - nextY;
                    const distSq = dx * dx + dy * dy;
                    if (distSq < bh.radius * bh.radius) {
                        collided = true;
                        break;
                    }
                    const force = G_BH / distSq;
                    vx += force * dx; // Fixed: Strong prediction gravity
                    vy += force * dy;
                }
                
                if (!collided) {
                    points.push({ x: nextX, y: nextY });
                }
            }

            // Draw Lensed Prediction
            ctx.setLineDash([4, 6]);
            ctx.beginPath();
            const startLensed = lensPoint(points[0].x, points[0].y);
            ctx.moveTo(startLensed.x, startLensed.y);
            for (let i = 1; i < points.length; i++) {
                const lensed = lensPoint(points[i].x, points[i].y);
                ctx.lineTo(lensed.x, lensed.y);
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.stroke();
            ctx.restore();

            // Markers
            ctx.beginPath(); ctx.arc(startX, startY, 7, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
            ctx.beginPath(); ctx.arc(endX, endY, 3, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
        }

        function drawScene() {
            drawBackground();
            drawBlackHoles();

            // Draw Trails
            ctx.save();
            balls.forEach((ball) => {
                if (ball.trail.length > 1) {
                    ctx.beginPath();
                    const startLensed = lensPoint(ball.trail[0].x, ball.trail[0].y);
                    ctx.moveTo(startLensed.x, startLensed.y);
                    for (let i = 1; i < ball.trail.length; i++) {
                        const lensed = lensPoint(ball.trail[i].x, ball.trail[i].y);
                        ctx.lineTo(lensed.x, lensed.y);
                    }
                    ctx.strokeStyle = ball.color;
                    ctx.globalAlpha = 0.4;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }
            });
            ctx.restore();

            // Draw Planets 
            for (const ball of balls) {
                const lensed = lensPoint(ball.x, ball.y);
                ctx.save();
                ctx.translate(lensed.x, lensed.y);
                ctx.rotate(lensed.angle);
                ctx.beginPath();
                ctx.ellipse(0, 0, ball.radius * lensed.squish, ball.radius * lensed.stretch, 0, 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();
                ctx.restore();
            }

            drawOverlayUI();
        }

        function updatePhysics() {
            // N-Body Gravity & Merging
            for (let i = 0; i < balls.length; i++) {
                if (balls[i].dead) continue;
                for (let j = i + 1; j < balls.length; j++) {
                    if (balls[j].dead) continue;

                    const b1 = balls[i];
                    const b2 = balls[j];
                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq);

                    if (dist < b1.radius + b2.radius) {
                        // Collision -> Merge
                        const m1 = b1.radius * b1.radius; 
                        const m2 = b2.radius * b2.radius;
                        const totalM = m1 + m2;
                        
                        const vx = (b1.vx * m1 + b2.vx * m2) / totalM;
                        const vy = (b1.vy * m1 + b2.vy * m2) / totalM;
                        const newRadius = Math.sqrt(totalM);

                        // Keep the properties of the larger planet
                        if (m1 > m2) {
                            b1.vx = vx; b1.vy = vy; b1.radius = newRadius;
                            b2.dead = true;
                        } else {
                            b2.vx = vx; b2.vy = vy; b2.radius = newRadius;
                            b1.dead = true;
                        }
                    } else {
                        // Corrected gravity between planets
                        const force = G_PLANET / distSq;
                        b1.vx += force * dx * (b2.radius * b2.radius);
                        b1.vy += force * dy * (b2.radius * b2.radius);
                        b2.vx -= force * dx * (b1.radius * b1.radius);
                        b2.vy -= force * dy * (b1.radius * b1.radius);
                    }
                }
            }

            // Apply Black Hole Gravity & Update Positions
            balls = balls.filter((ball) => {
                if (ball.dead) return false;

                ball.x += ball.vx;
                ball.y += ball.vy;

                let swallowed = false;
                for (const bh of blackHoles) {
                    const dx = bh.x - ball.x;
                    const dy = bh.y - ball.y;
                    const distSq = dx * dx + dy * dy;
                    
                    if (Math.sqrt(distSq) < bh.radius) {
                        bh.radius += (ball.radius * 0.05); 
                        swallowed = true;
                        break;
                    }

                    // Fixed: Reverted back to the strong screen-space formula
                    const force = G_BH / distSq;
                    ball.vx += force * dx;
                    ball.vy += force * dy;
                }

                if (swallowed) return false;

                ball.trail.push({ x: ball.x, y: ball.y });
                const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                const dynamicTailLength = Math.floor(100 + (speed * 15)); // Base length + scaled by speed
                while (ball.trail.length > dynamicTailLength) {
                    ball.trail.shift();
                }

                return true;
            });

            drawScene();
            requestAnimationFrame(updatePhysics);
        }

        // --- CONTROLS ---
        canvas.addEventListener('mousedown', (e) => {
            if (e.target !== canvas) return;
            if (placementMode === 'PLANET') {
                dragging = true;
                drawOverlay = true;
                startX = e.clientX; startY = e.clientY;
                endX = e.clientX; endY = e.clientY;
            } else if (placementMode === 'BLACKHOLE') {
                blackHoles.push({
                    x: e.clientX,
                    y: e.clientY,
                    radius: 35 
                });
                drawScene();
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!dragging || placementMode !== 'PLANET') return;
            endX = e.clientX;
            endY = e.clientY;
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!dragging || placementMode !== 'PLANET') return;
            const vx = -(e.clientX - startX) / 10;
            const vy = -(e.clientY - startY) / 10;
            const color = planetColors[Math.floor(Math.random() * planetColors.length)];
            
            balls.push({ 
                x: startX, y: startY, 
                radius: 6, vx, vy, 
                color: color, 
                trail: [], 
                dead: false 
            });
            
            dragging = false;
            drawOverlay = false;
        });

        canvas.addEventListener('touchstart', (e) => {
            if (e.target !== canvas) return;
            e.preventDefault();
            if (placementMode === 'PLANET') {
                dragging = true; drawOverlay = true;
                startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                endX = startX; endY = startY;
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!dragging || placementMode !== 'PLANET') return;
            e.preventDefault();
            endX = e.touches[0].clientX; endY = e.touches[0].clientY;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (placementMode === 'BLACKHOLE' && !dragging && e.changedTouches.length > 0) {
                blackHoles.push({ x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY, radius: 35 });
            } else if (dragging && placementMode === 'PLANET') {
                const vx = -(endX - startX) / 10;
                const vy = -(endY - startY) / 10;
                const color = planetColors[Math.floor(Math.random() * planetColors.length)];
                balls.push({ x: startX, y: startY, radius: 6, vx, vy, color, trail: [], dead: false });
                dragging = false; drawOverlay = false;
            }
        });

        init();
    </script>
</body>
</html>
