<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>꽃날 (Flower Day) — Coarse Paper & Graphite Piano</title>
  <!-- Handwritten Calligraphy/Pencil Fonts + Clean Modern UI Font -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>

  <!-- SVG ENGINE: 1. Coarse Cold-Press Paper Texture & 2. Rough Graphite Edge
       (both filters are test.html's, unchanged — every stroke on the page uses them) -->
  <svg class="coarse-paper-layer" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Physical 3D Bump-Lit Coarse Paper Filter -->
      <filter id="coarse-paper" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045 0.05" numOctaves="5" seed="11" result="roughFibers" />
        <feDiffuseLighting in="roughFibers" lighting-color="#f2ece1" surfaceScale="2.6" diffuseConstant="0.95" result="litPaper">
          <feDistantLight azimuth="130" elevation="52" />
        </feDiffuseLighting>
      </filter>

      <!-- Granular Graphite Pencil Edge Filter -->
      <filter id="graphite-edge" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="grain" />
        <feDisplacementMap in="SourceGraphic" in2="grain" scale="1.9" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
    <rect width="100%" height="100%" filter="url(#coarse-paper)" />
  </svg>

  <!-- MAIN 2D APPLICATION LAYER -->
  <div class="app-layer">

    <!-- 1. TOP BAR -->
    <header class="top-bar">
      <div class="title-group">
        <h1 id="song-title"></h1>
        <span id="song-subtitle"></span>
        <span id="song-meta"></span>
        <span id="progress" class="title-progress"></span>
      </div>

      <div class="modern-controls">
        <div class="pill-switch" role="group" aria-label="Notation Mode">
          <button id="btn-num" class="pill-btn active">123</button>
          <button id="btn-let" class="pill-btn">ABC</button>
        </div>

        <button id="btn-compact" class="modern-icon-btn" title="Spacing between systems" aria-label="Spacing between systems">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="4" x2="21" y2="4"/>
            <line x1="3" y1="20" x2="21" y2="20"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <path d="M9.5 10.5 12 8l2.5 2.5"/>
            <path d="M9.5 13.5 12 16l2.5-2.5"/>
          </svg>
        </button>

        <button id="btn-keys-default" class="modern-icon-btn active" title="Keyboard: octaves 2–6 above middle C" aria-label="Keyboard: octaves 2 to 6">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="7" width="14" height="10" rx="1.5"/>
            <line x1="9.5" y1="7" x2="9.5" y2="17"/>
            <line x1="14.5" y1="7" x2="14.5" y2="17"/>
            <line x1="7.2" y1="7" x2="7.2" y2="11.5"/>
            <line x1="12" y1="7" x2="12" y2="11.5"/>
          </svg>
        </button>

        <button id="btn-keys-full" class="modern-icon-btn" title="Keyboard: the full 88 keys" aria-label="Keyboard: full 88 keys">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="10" rx="1.5"/>
            <line x1="5" y1="7" x2="5" y2="17"/>
            <line x1="8" y1="7" x2="8" y2="17"/>
            <line x1="11" y1="7" x2="11" y2="17"/>
            <line x1="14" y1="7" x2="14" y2="17"/>
            <line x1="17" y1="7" x2="17" y2="17"/>
            <line x1="20" y1="7" x2="20" y2="17"/>
          </svg>
        </button>

        <button id="btn-play" class="modern-icon-btn" title="Play from this measure to the end" aria-label="Play">
          <svg class="icon-play" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 4.5 19.5 12 7 19.5Z"/>
          </svg>
          <svg class="icon-pause" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <line x1="9" y1="5" x2="9" y2="19"/>
            <line x1="15" y1="5" x2="15" y2="19"/>
          </svg>
        </button>

        <button id="btn-stop" class="modern-icon-btn" title="Stop" aria-label="Stop">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="6" width="12" height="12" rx="1.5"/>
          </svg>
        </button>

        <button id="btn-panel" class="modern-icon-btn" title="Show what is being heard" aria-label="Listening panel" aria-pressed="false">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="14" x2="4" y2="18"/>
            <line x1="8" y1="10" x2="8" y2="18"/>
            <line x1="12" y1="5" x2="12" y2="18"/>
            <line x1="16" y1="11" x2="16" y2="18"/>
            <line x1="20" y1="7" x2="20" y2="18"/>
          </svg>
        </button>

        <button id="btn-mic" class="modern-icon-btn" title="Start / Stop Microphone" aria-label="Microphone" aria-pressed="false">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
          </svg>
        </button>

        <button id="btn-reset" class="modern-icon-btn" title="Back to measure 1" aria-label="Back to measure 1">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 2. THE SCORE: sixteen systems scrolling through, drawn by js/sheet-render.js -->
    <main class="sheet-area" id="sheet-area">
      <div class="sheet-canvas" id="sheet-canvas"></div>
    </main>

  </div>

  <!-- 3. THE PAPER CAP: the same texture, aligned with the page and clipped to the
       keyboard's band, so the sheet passes behind the keys without a seam -->
  <div class="paper-cap" aria-hidden="true">
    <svg class="coarse-paper-layer" xmlns="http://www.w3.org/2000/svg">
      <rect width="100%" height="100%" filter="url(#coarse-paper)" />
    </svg>
  </div>

  <!-- 4. THE KEYBOARD, pinned along the bottom -->
  <footer class="piano-section">
    <div class="piano-frame" id="piano-frame"></div>
  </footer>

  <!-- 5. THE RULER down the right margin -->
  <div class="ruler-layer" id="ruler-layer" title="Drag to scroll through the piece"></div>

  <!-- 6. THE MEASURE MENU: what clicking a measure offers when the microphone is off -->
  <div class="measure-menu" id="measure-menu" hidden>
    <span class="menu-title">Measure 1</span>
    <button id="menu-here" class="menu-button">Play just this measure</button>
    <button id="menu-onward" class="menu-button">Play from here to the end</button>
  </div>

  <!-- 7. THE LISTENING PANEL: what the detector can hear, and the test recording -->
  <section class="diag" id="diag" hidden>
    <span class="diag-title">Listening</span>
    <p class="diag-line" id="diag-source"></p>
    <p class="diag-line" id="diag-target"></p>
    <p class="diag-line" id="diag-notes"></p>
    <p class="diag-line" id="diag-heard"></p>
    <div class="chroma" id="diag-chroma"></div>
    <div class="diag-audio">
      <button id="btn-test" class="diag-button">Play the test recording</button>
      <input type="range" id="test-seek" min="0" max="1000" value="0" aria-label="Where in the test recording">
    </div>
  </section>

  <!-- The score as data (generated from music-sheet/flower_day.json by tools/build_score.py),
       then the modules, loaded as classic scripts so the page also opens from disk. -->
  <script src="music-sheet/flower-day.js"></script>
  <script src="js/config.js"></script>
  <script src="js/pitch-utils.js"></script>
  <script src="js/notes-number.js"></script>
  <script src="js/notes-letter.js"></script>
  <script src="js/score-loader.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/sheet-render.js"></script>
  <script src="js/keyboard-render.js"></script>
  <script src="js/ruler.js"></script>
  <script src="js/pitch-detect.js"></script>
  <script src="js/piano-sound.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/playback.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
