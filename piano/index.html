<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>꽃날 (Flower Day) — Piano Trainer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>

  <!-- Paper grain and the pencil-edge filters. app.js fills in the <defs>. -->
  <svg class="paper-layer" id="paper-layer" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>

  <div class="app-layer">

    <header class="top-bar">
      <div class="title-group">
        <h1 id="song-title">꽃날 (Flower Day)</h1>
        <span id="song-subtitle"></span>
      </div>

      <div class="controls">
        <!-- Notation toggle: 123 (Jianpu) or ABC (letter names) -->
        <div class="pill-switch" role="group" aria-label="Notation">
          <button id="btn-num" class="pill-btn active" type="button">123</button>
          <button id="btn-let" class="pill-btn" type="button">ABC</button>
        </div>

        <!-- Microphone: starts and stops the listening (practice) mode -->
        <button id="btn-mic" class="icon-btn" type="button" title="Microphone: start / stop practice listening">
          <svg class="icon-ring" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="17.5" />
          </svg>
          <svg class="icon-glyph" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="2.5" width="6" height="11" rx="3" />
            <path d="M5.5 11.5v1a6.5 6.5 0 0 0 13 0v-1" />
            <path d="M12 19v3" />
          </svg>
        </button>

        <!-- Reset: back to measure 1 -->
        <button id="btn-reset" class="icon-btn" type="button" title="Back to measure 1">
          <svg class="icon-ring" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="17.5" />
          </svg>
          <svg class="icon-glyph" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" />
            <path d="M3 3.5v5h5" />
          </svg>
        </button>

        <!-- Staff spacing: cycles normal -> tight -> loose -->
        <button id="btn-density" class="icon-btn" type="button" data-density="normal"
                title="Staff spacing: normal (click for tight)">
          <svg class="icon-ring" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="17.5" />
          </svg>
          <span class="icon-badge" aria-hidden="true">N</span>
          <svg class="icon-glyph viewBox="0 0 24 24" aria-hidden="true">
            <g class="density-normal">
              <path d="M3 6.5h18M3 12h18M3 17.5h18" />
            </g>
            <g class="density-tight">
              <path d="M3 5.5h18M3 8.5h18M3 15h18M3 18h18" />
            </g>
            <g class="density-loose">
              <path d="M3 4.5h18M3 12h18M3 19.5h18" />
            </g>
          </svg>
        </button>
      </div>
    </header>

    <main class="sheet-area" id="sheet-area"></main>

    <footer class="piano-section">
      <div class="piano-frame" id="piano-frame">
        <p class="placeholder-note">The piano keyboard arrives in phase 2</p>
      </div>
    </footer>

    <div class="status-bar">
      <span id="progress-label">Measure 1 / 64</span>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/pitch-utils.js"></script>
  <script src="js/notes-letter.js"></script>
  <script src="js/notes-number.js"></script>
  <script src="js/staff-utils.js"></script>
  <script src="js/glyphs-bravura.js"></script>
  <script src="music-sheet/flower-day.js"></script>
  <script src="js/score-loader.js"></script>
  <script src="js/sheet-render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
